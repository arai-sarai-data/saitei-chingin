<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>最低賃金の地域差と「発効日のばらつき」 2026年度版</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1b19;--sub:#5f5d56;--line:#e3e0d7;--acc:#0f766e;--lo:#d3eee8;--good:#2f6f4f}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1f1e1b;--ink:#efede7;--sub:#aaa79e;--line:#35332e;--lo:#1d302d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Noto Sans SC","Noto Sans KR",system-ui,sans-serif;line-height:1.7;overflow-wrap:anywhere}
body.lang-zh{font-family:"Noto Sans SC","Noto Sans JP",system-ui,sans-serif}
body.lang-ko{font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 0;flex-wrap:wrap}
.kicker{font-size:13px;letter-spacing:.08em;color:var(--acc);font-weight:700}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs a{font-size:13px;text-decoration:none;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.langs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
header{padding:22px 0 18px}
h1{font-size:clamp(28px,5.2vw,48px);line-height:1.2;margin:.15em 0 .25em;font-weight:900;letter-spacing:-.01em}
.hook{font-size:clamp(18px,2.6vw,24px);font-weight:700;line-height:1.5;margin:.4em 0 .6em;padding-left:14px;border-left:6px solid var(--acc)}
.lead{color:var(--sub);max-width:780px;font-size:15.5px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin:6px 0 22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:clamp(24px,3.4vw,30px);font-variant-numeric:tabular-nums;line-height:1.25;font-weight:900;color:var(--acc)}
.kpi span{font-size:13px;color:var(--sub)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
h2{font-size:20px;margin:0 0 12px;line-height:1.4}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tabs button,.btn,select{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
select{border-radius:10px;max-width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:780px){.grid2{grid-template-columns:minmax(0,1fr)}}
.map{container-type:inline-size;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:repeat(14,minmax(0,1fr));gap:3px;aspect-ratio:13/14;width:100%;max-width:470px}
.tile{border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#fff;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,.45);overflow:hidden;line-height:1.05;padding:0 1px;word-break:break-all;font-size:12px}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{display:block;height:10px;width:140px;border-radius:5px;background:linear-gradient(90deg,var(--lo),var(--acc))}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
@media (max-width:520px){.tops{grid-template-columns:1fr}}
.tops div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tops h3{font-size:13px;margin:0 0 4px;color:var(--sub)}
.tops ol{margin:0;padding-left:1.4em;font-size:14px}
.tops li span{float:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars{max-height:560px;overflow:auto;padding-right:4px}
.bar{display:grid;grid-template-columns:26px minmax(64px,96px) minmax(40px,1fr) 74px;align-items:center;gap:6px;font-size:13px;padding:2px 2px;cursor:pointer}
.bar .t{height:14px;background:var(--line);border-radius:3px;position:relative}
.bar .t div{height:100%;background:var(--acc);border-radius:3px}
.bar .nat{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar.sel{background:color-mix(in srgb,var(--acc) 15%,transparent);border-radius:4px;font-weight:700}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{color:var(--sub);text-align:right}
.note{font-size:13px;color:var(--sub)}
.mine{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:780px){.mine{grid-template-columns:minmax(0,1fr)}}
.badge{border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));color:#fff}
.badge .pn{font-size:15px;opacity:.9}
.badge .big{font-size:clamp(34px,6vw,52px);font-weight:900;line-height:1.1;margin:4px 0}
.badge .lab{font-size:14px;opacity:.95}
.badge .shr{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge a,.badge button{font:inherit;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;text-decoration:none;cursor:pointer}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin-top:12px}
.detail div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.detail b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.detail small{color:var(--sub);display:block;line-height:1.4}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.insights div{border-left:4px solid var(--acc);padding:8px 12px;background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:0 10px 10px 0;font-size:14.5px}
.quiz .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.quiz .opts button{font:inherit;font-size:15px;border:2px solid var(--line);background:transparent;color:var(--ink);padding:8px 18px;border-radius:12px;cursor:pointer}
.quiz .opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.quiz .opts button.ng{border-color:#b42318;opacity:.7}
.quiz .ans{font-size:14.5px;min-height:1.5em}
.regs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:780px){.regs{grid-template-columns:1fr}}
.regs h3{font-size:14px;margin:0 0 6px}
.rg{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.rg .t{height:12px;background:var(--line);border-radius:3px}
.rg .t div{height:100%;background:var(--acc);border-radius:3px}
.rg .v{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{cursor:pointer;color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--card);z-index:1}
th:first-child{z-index:2}
.tablewrap{max-height:520px;overflow:auto}
.note li{margin-bottom:4px}
a{color:var(--acc)}
footer{padding:4px 0 40px;font-size:12px;color:var(--sub)}

", "2025年度の秋田で最低賃金・週40時間で働いた人は、10月1日発効と比べ約<b>82,743円</b>分の引上げを受け取らなかった計算です（本サイト試算）。", "2年間（2025・2026年度）の上昇額が最も大きいのは<b>大分県の+142円</b>。"], "notes": ["2026年度の金額・発効日は答申時点の値です。発効日は異議申出の状況などで変わる可能性があると厚生労働省が注記しています。", "2026年度資料の改定前額は、2025年度の確定額と47都道府県すべて一致することを確認しています。", "「遅れの差額試算」は週40時間・毎日均等に働くと仮定した単純計算です。実際の勤務時間・雇用形態・特定（産業別）最低賃金の適用で異なります。", "発効の遅れの基準日を各年10月1日としたのは本サイトの設定です。"]}, "en": {"title": "Japan’s minimum wage: regional gaps and uneven start dates (FY2026)", "kicker": "Public data site 02 | Work & living", "h1": "Japan’s minimum wage: how much, where, and from when?", "hook": "Tokyo vs. Miyazaki: ¥31,200 a month apart. And in FY2025, Akita’s raise came half a year late.", "lead": "Compares FY2026 regional minimum wages (council recommendations) across all 47 prefectures — not only the amounts, but also when each raise takes effect. In FY2025, the largest raise ever, start dates were spread as late as the end of March, which the national council later flagged as a problem.", "kpis": [["¥1,177", "FY2026 national weighted average (+¥56)"], ["¥31,200", "Tokyo vs. Miyazaki per month (160 hours)"], ["40 → 14 days", "Average delay in effective date, FY2025 → FY2026"], ["181 days", "FY2025 longest delay: Akita (effective 31 Mar 2026)"]], "m": {"amt": {"label": "Minimum wage (FY2026)", "desc": "FY2026 recommended hourly amount. National weighted average: ¥1,177.", "rank": "Highest"}, "inc": {"label": "Raise (FY2026)", "desc": "Increase from FY2025. National weighted average: ¥56.", "rank": "Largest"}, "l6": {"label": "Start delay (FY2026)", "desc": "Days from 1 Oct 2026 to the planned effective date (as recommended).", "rank": "Latest"}, "l5": {"label": "Start delay (FY2025)", "desc": "Days from 1 Oct 2025 to the effective date. Maximum: 181 days (Akita).", "rank": "Latest"}, "loss5": {"label": "Est. pay lost to delay (FY2025)", "desc": "Estimated raise not received by someone on the minimum wage working 40 h/week, versus a 1 October start (raise × 40 h ÷ 7 × days of delay).", "rank": "Largest"}}, "tc": {"amt": "FY26 wage", "inc": "Raise", "rate": "Raise %", "d6": "FY26 start", "l6": "Delay", "amt5": "FY25 wage", "inc5": "FY25 raise", "d5": "FY25 start", "l5": "Delay", "loss5": "FY25 est. loss", "two": "2-year rise", "gap": "vs. Tokyo", "month": "Monthly (160 h)"}, "say": "{name}: FY2026 minimum wage {v:amt} (+{v:inc}), planned start {v:d6} ({v:l6} after 1 Oct). FY2025: {v:amt5}, effective {v:d5} ({v:l5} after 1 Oct). Up {v:two} over two years.", "share": "Japan minimum wage 2026: {name} ranks #{cr} of 47 on “{label}” ({cv}). Tokyo vs. Miyazaki: ¥31,200 a month apart. Where does yours rank?", "quiz": {"q": "Which prefecture has the lowest minimum wage in FY2026?", "opts": [46, 38, 44, 4], "ans": 44, "exp": "Miyazaki at ¥1,085 — just ¥1 below Kochi and Okinawa (¥1,086). In FY2025 those three were tied at ¥1,023."}, "insights": ["The FY2026 lowest is <b>Miyazaki at ¥1,085</b>, ¥195/hour below Tokyo (¥1,280) — <b>¥31,200</b> over 160 hours. The lowest-to-highest ratio is 84.8%, narrowing for the 12th straight year.", "In FY2025 start dates varied widely; <b>Akita’s took effect on 31 March 2026 (181 days late)</b>. The central council cited temporary widening of regional gaps and reduced predictability for workers and employers as problems.", "In FY2026 the average delay fell from 40 to <b>14 days</b>. The latest is Okinawa (2 Dec, 62 days). Akita moved up sharply to 14 Oct.", "A minimum-wage worker in Akita on 40 h/week missed an estimated <b>¥82,743</b> of the FY2025 raise compared with a 1 October start (this site’s estimate).", "The largest two-year increase (FY2025+FY2026): <b>Oita, +¥142</b>."], "notes": ["FY2026 amounts and dates are as recommended; the ministry notes dates may change depending on objections.", "The pre-revision amounts in the FY2026 document match the final FY2025 amounts for all 47 prefectures.", "The delay estimate assumes 40 hours a week spread evenly; actual hours, employment type and industry-specific minimum wages will differ.", "Using 1 October as the baseline for delays is this site’s choice."]}, "zh": {"title": "日本最低工资的地区差距与“生效日期不一”（2026年度版）", "kicker": "公共数据网站 02 ｜ 工作·生活", "h1": "日本最低工资：哪里多少钱、从何时开始？", "hook": "东京与宫崎每月相差31,200日元。而在2025年度，秋田的上调晚了半年。", "lead": "比较2026年度47个都道府县的地区最低工资（审议会答复）。除金额差距外，也将“何时开始上调”的差异可视化。上调幅度创历史新高的2025年度，生效日期一直分散到次年3月底，国家审议会也将其列为课题。", "kpis": [["1,177日元", "2026年度 全国加权平均（+56日元）"], ["31,200日元", "东京与宫崎的差（按每月160小时）"], ["40天→14天", "生效延迟（47个都道府县平均）2025→2026年度"], ["181天", "2025年度最大延迟：秋田（2026年3月31日生效）"]], "m": {"amt": {"label": "最低工资（2026年度）", "desc": "2026年度答复金额（时薪）。全国加权平均1,177日元。", "rank": "由高到低"}, "inc": {"label": "上调额（2026年度）", "desc": "较2025年度的上调额。全国加权平均56日元。", "rank": "由大到小"}, "l6": {"label": "生效延迟（2026年度）", "desc": "从2026年10月1日到预定生效日的天数（答复时的预定）。", "rank": "由晚到早"}, "l5": {"label": "生效延迟（2025年度）", "desc": "从2025年10月1日到生效日的天数。最长181天（秋田）。", "rank": "由晚到早"}, "loss5": {"label": "延迟造成的差额估算（2025年度）", "desc": "按最低工资每周工作40小时的人，与10月1日生效相比未领取的上调部分估算（上调额×40小时÷7×延迟天数）。", "rank": "由大到小"}}, "tc": {"amt": "2026时薪", "inc": "上调额", "rate": "上调率", "d6": "2026预定生效", "l6": "延迟", "amt5": "2025时薪", "inc5": "2025上调额", "d5": "2025生效日", "l5": "延迟", "loss5": "2025延迟差额估算", "two": "两年涨幅", "gap": "与东京之差", "month": "每月160小时"}, "say": "{name}2026年度最低工资为{v:amt}（+{v:inc}），预定{v:d6}生效（10月1日后{v:l6}）。2025年度为{v:amt5}，于{v:d5}生效（{v:l5}后）。两年共上涨{v:two}。", "share": "【日本最低工资2026】{name}在“{label}”中位列47个都道府县第{cr}名（{cv}）。东京与宫崎每月相差31,200日元。你的县呢？", "quiz": {"q": "2026年度最低工资最低的都道府县是？", "opts": [46, 38, 44, 4], "ans": 44, "exp": "宫崎县1,085日元，比高知和冲绳（1,086日元）低1日元。2025年度这三个县并列1,023日元。"}, "insights": ["2026年度最低为<b>宫崎的1,085日元</b>，比东京（1,280日元）每小时低195日元，按每月160小时相差<b>31,200日元</b>。最低额与最高额之比为84.8%，连续12年缩小。", "2025年度生效日期差异很大，<b>秋田于2026年3月31日生效（延迟181天）</b>。中央最低工资审议会指出，这会造成地区差距暂时扩大、劳资双方难以预期等问题。", "2026年度平均延迟从40天缩短至<b>14天</b>。最晚的是冲绳（预定12月2日，62天）。秋田大幅提前至10月14日。", "2025年度在秋田按最低工资每周工作40小时的人，与10月1日生效相比约少领<b>82,743日元</b>的上调部分（本网站估算）。", "两年（2025·2026年度）累计涨幅最大的是<b>大分县，+142日元</b>。"], "notes": ["2026年度的金额和生效日期为答复时的数值。厚生劳动省注明，生效日期可能因异议申请情况而变更。", "已确认2026年度资料中的修订前金额与2025年度确定金额在47个都道府县全部一致。", "“延迟差额估算”假设每周均匀工作40小时，实际因工作时间、雇佣形态及特定（产业别）最低工资而异。", "以每年10月1日为延迟基准日是本网站的设定。"]}, "ko": {"title": "일본 최저임금의 지역 격차와 ‘제각각인 발효일’ 2026년도판", "kicker": "공공 데이터 사이트 02 | 일·생활", "h1": "일본 최저임금, 어디서 얼마·언제부터?", "hook": "도쿄와 미야자키의 차이는 월 31,200엔. 그리고 2025년도, 아키타의 인상은 반년 늦었다.", "lead": "2026년도 47개 도도부현의 지역별 최저임금(심의회 답신)을 비교합니다. 금액 차이뿐 아니라 ‘언제부터 오르는지’의 차이도 보여 줍니다. 사상 최대 인상이었던 2025년도에는 발효일이 이듬해 3월 말까지 흩어졌고, 국가 심의회도 이를 과제로 꼽았습니다.", "kpis": [["1,177엔", "2026년도 전국 가중평균(+56엔)"], ["31,200엔", "도쿄와 미야자키의 차이(월 160시간 환산)"], ["40일→14일", "발효 지연(47개 평균) 2025→2026년도"], ["181일", "2025년도 최대 지연: 아키타(2026년 3월 31일 발효)"]], "m": {"amt": {"label": "최저임금(2026년도)", "desc": "2026년도 답신액(시급). 전국 가중평균 1,177엔.", "rank": "높은 순"}, "inc": {"label": "인상액(2026년도)", "desc": "2025년도 대비 인상액. 전국 가중평균 56엔.", "rank": "큰 순"}, "l6": {"label": "발효 지연(2026년도)", "desc": "2026년 10월 1일부터 발효 예정일까지의 일수(답신 시점 예정).", "rank": "늦은 순"}, "l5": {"label": "발효 지연(2025년도)", "desc": "2025년 10월 1일부터 발효일까지의 일수. 최대 181일(아키타).", "rank": "늦은 순"}, "loss5": {"label": "지연에 따른 차액 추산(2025년도)", "desc": "최저임금으로 주 40시간 일하는 사람이 10월 1일 발효였을 때와 비교해 받지 못한 인상분 추산(인상액×40시간÷7×지연 일수).", "rank": "큰 순"}}, "tc": {"amt": "2026 시급", "inc": "인상액", "rate": "인상률", "d6": "2026 발효 예정", "l6": "지연", "amt5": "2025 시급", "inc5": "2025 인상액", "d5": "2025 발효일", "l5": "지연", "loss5": "2025 지연 차액", "two": "2년 상승", "gap": "도쿄와 차이", "month": "월 160시간"}, "say": "{name}의 2026년도 최저임금은 {v:amt}(+{v:inc}), 발효 예정일은 {v:d6}(10월 1일부터 {v:l6} 후)입니다. 2025년도는 {v:amt5}, 발효일은 {v:d5}({v:l5} 후)였습니다. 2년간 {v:two} 올랐습니다.", "share": "[일본 최저임금 2026] {name}은(는) ‘{label}’에서 47개 도도부현 중 {cr}위({cv}). 도쿄와 미야자키는 월 31,200엔 차이. 우리 현은?", "quiz": {"q": "2026년도 최저임금이 가장 낮은 도도부현은?", "opts": [46, 38, 44, 4], "ans": 44, "exp": "미야자키현 1,085엔. 고치·오키나와(1,086엔)보다 1엔 낮습니다. 2025년도에는 세 현이 1,023엔으로 같았습니다."}, "insights": ["2026년도 최저는 <b>미야자키 1,085엔</b>. 도쿄(1,280엔)와 시급 195엔, 월 160시간으로 <b>31,200엔</b> 차이. 최고액 대비 최저액 비율은 84.8%로 12년 연속 좁혀졌습니다.", "2025년도에는 발효일이 크게 흩 function draw(){const t=T(),u=U(),m=M(cur),vals=D.map(d=>d[cur]),mn=Math.min(...vals),mx=Math.max(...vals);
 $('#mdesc').textContent=t.m[cur].desc;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
 const r=ranked(cur);
 const li=d=>`<li value="${rankOf(cur,d.i)}">${nm(d.i)}<span>${fmt(d[cur],m)}</span></li>`;$('#tops').innerHTML=`<div><h3>${u.worst}</h3><ol>${r.slice(0,5).map(li).join('')}</ol></div><div><h3>${u.best}</h3><ol>${r.slice(-5).map(li).join('')}</ol></div>`;
 const map=$('#map');map.innerHTML='';const ab=P.abbr[L];
 D.forEach(d=>{const e=document.createElement('div');e.className='tile'+(d.i===sel?' sel':'');e.style.gridColumn=d.x+1;e.style.gridRow=d.y+1;
  let k=(d[cur]-mn)/(mx-mn||1);if(!m.desc)k=1-k;e.style.background=col(.1+.9*k);const a=ab[d.i];e.textContent=a;
  e.title=nm(d.i)+' '+fmt(d[cur],m);e.setAttribute('role','button');e.setAttribute('aria-label',e.title);
  e.onclick=()=>{sel=d.i;store('pref',sel);draw()};map.appendChild(e)});
 fitTiles();
 $('#lgl').textContent=m.desc?u.low:u.high;$('#lgh').textContent=m.desc?u.high:u.low;
 const bars=$('#bars');bars.innerHTML='';const base=Math.min(0,mn),span=mx-base||1,nat=S.national[cur];
 r.forEach((d,i)=>{const e=document.createElement('div');e.className='bar'+(d.i===sel?' sel':'');
  e.innerHTML=`<span class="rk">${rankOf(cur,d.i)}</span><span class="nm">${nm(d.i)}</span><span class="t"><div style="width:${Math.max(1,(d[cur]-base)/span*100)}%"></div>${nat==null?'':`<span class="nat" style="left:${(nat-base)/span*100}%"></span>`}</span><span class="v">${fmt(d[cur],m)}</span>`;
  e.onclick=()=>{sel=d.i;store('pref',sel);draw()};bars.appendChild(e)});
 $('#natlab').textContent=nat==null?'':u.natline.replace('{v}',fmt(nat,m));
 const selBar=bars.querySelector('.bar.sel');if(selBar)bars.scrollTop=Math.max(0,selBar.offsetTop-bars.offsetTop-bars.clientHeight/2);
 mine();}
function fitTiles(){document.querySelectorAll('.tile').forEach(t=>{let s=12;t.style.fontSize=s+'px';while(s>6&&(t.scrollWidth>t.clientWidth+0.5||t.scrollHeight>t.clientHeight+0.5)){s-=0.5;t.style.fontSize=s+'px'}})}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fitTiles,120)});
function mine(){const t=T(),u=U(),d=D.find(x=>x.i===sel);$('#psel').value=sel;
 $('#ptext').textContent=fill(t.say,d);
 const rk=rankOf(cur,d.i),txt=fill(t.share,d);
 $('#badge').innerHTML=`<div class="pn">${nm(d.i)} — ${t.m[cur].label}</div><div class="big">${u.rank.replace('{r}',rk)}</div><div class="lab">${fmt(d[cur],M(cur))}</div><div class="shr"><a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(S.url)}" target="_blank" rel="noopener">${u.sharex}</a><button id="cpshare">${u.copyshare}</button></div>`;
 $('#cpshare').onclick=async()=>{try{await navigator.clipboard.writeText(txt+' '+S.url);$('#cpshare').textContent=u.copied}catch(e){$('#cpshare').textContent=u.copyfail}};
 $('#detail').innerHTML=S.metrics.map(m=>`<div><small>${t.m[m.k].label}</small><b>${fmt(d[m.k],m)}</b><small>${t.m[m.k].rank} ${u.rank.replace('{r}',rankOf(m.k,d.i))}</small></div>`).join('');}
function table(){const t=T(),cols=S.tcols;
 const rows=[...D].sort((a,b)=>{if(!sortK)return a.i-b.i;const A=a[sortK],B=b[sortK];return (A>B?1:A<B?-1:a.i-b.i)*(asc?1:-1)});
 $('#tbl').innerHTML=`<thead><tr><th data-k="">${U().prefcol}</th>${cols.map(c=>`<th data-k="${c.k}">${t.tc[c.k]}${sortK===c.k?(asc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(d=>`<tr><td>${nm(d.i)}</td>${cols.map(c=>`<td>${fmt(d[c.k],c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
 document.querySelectorAll('#tbl th').forEach(th=>th.onclick=()=>{const k=th.dataset.k||null;if(sortK===k)asc=!asc;else{sortK=k;asc=!k}table()})}
function csv(){const t=T(),q=s=>/[",\n]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':s;return ['pref',...S.tcols.map(c=>t.tc[c.k])].map(q).join(',')+'\n'+[...D].sort((a,b)=>a.i-b.i).map(d=>[nm(d.i),...S.tcols.map(c=>d[c.k])].map(q).join(',')).join('\n')}
function route(){const h=location.hash.slice(1);L=LANGS.includes(h)?h:(LANGS.includes(load('lang'))?load('lang'):(navigator.language||'ja').slice(0,2));if(!LANGS.includes(L))L='en';store('lang',L);shell()}
window.addEventListener('hashchange',route);
